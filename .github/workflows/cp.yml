name: MLOps CI Pipeline (Week 5 - MLflow)

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  train-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Data is still versioned through DVC (Task 4: data only, not models)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: DVC pull data
        run: dvc pull -v

      # Task 6 (optional): train + log to MLflow so a model exists in the
      # registry for this CI run to fetch and sanity-check
      - name: Run training with hyperparameter tuning + MLflow logging
        run: python3 scripts/train_mlflow.py --iteration 3

      # Task 6 (optional): fetch the latest model from MLflow Registry
      # and run sanity checks against it, instead of a DVC-based model
      - name: Run pytest suite (model fetched from MLflow Registry)
        run: pytest tests/ --junitxml=pytest_report.xml -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest_report.xml

      - name: Upload MLflow run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlruns
          path: mlruns/