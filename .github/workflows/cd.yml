name: CD Pipeline - Build, Push, Deploy

on:
  push:
    branches:
      - '**'
  workflow_dispatch: {}

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      # Task 6 (optional): training and model-fetching now happen INSIDE
      # the Docker build itself (see Dockerfile), so the MLflow tracking
      # database and artifact paths stay consistent within one filesystem.
      # No separate host-side training step is needed here.

      - name: Task 4 - Build Docker image
        run: |
          IMAGE_URI="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_REPO_NAME }}/${{ secrets.GCP_IMAGE_NAME }}:${{ github.sha }}"
          docker build \
            --build-arg FETCH_MODEL=true \
            --build-arg MLFLOW_TRACKING_URI=sqlite:///mlflow.db \
            --build-arg MODEL_NAME=iris_random_forest \
            -t "$IMAGE_URI" \
            -t "${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_REPO_NAME }}/${{ secrets.GCP_IMAGE_NAME }}:latest" \
            .
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Task 4 - Push image to Artifact Registry
        run: |
          docker push "${{ env.IMAGE_URI }}"
          docker push "${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_REPO_NAME }}/${{ secrets.GCP_IMAGE_NAME }}:latest"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GCP_CLUSTER_NAME }}
          location: ${{ secrets.GCP_REGION }}

      - name: Deploy to GKE
        run: |
          IMAGE_URI="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_REPO_NAME }}/${{ secrets.GCP_IMAGE_NAME }}:latest"
          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE_URI|g" k8s/deployment.yaml
    
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml
    
          kubectl rollout status deployment/iris-api --timeout=180s


      - name: Verify deployment - get external IP and call API
        run: |
          echo "Waiting for LoadBalancer IP..."
          for i in {1..30}; do
            IP=$(kubectl get svc iris-api-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            if [ -n "$IP" ]; then break; fi
            sleep 10
          done
          echo "Service IP: $IP"
          curl -s "http://$IP/health" || echo "Health check not yet reachable"

      - name: Install wrk
        run: sudo apt-get update && sudo apt-get install -y wrk

      - name: Get LoadBalancer External IP
        run: |
          echo "Waiting for External IP..."
          for i in {1..30}; do
            EXTERNAL_IP=$(kubectl get svc iris-api-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ -n "$EXTERNAL_IP" ]; then
              echo "EXTERNAL_IP=$EXTERNAL_IP" >> $GITHUB_ENV
              echo "API available at $EXTERNAL_IP"
              break
            fi
            sleep 10
          done

      - name: Execute Stress Test
        run: |
          wrk -t4 -c2000 -d30s -s scripts/post.lua http://${EXTERNAL_IP}/predict
