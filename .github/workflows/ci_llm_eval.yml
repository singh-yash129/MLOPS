name: LLMOps-Evaluation-Guard

on:
  push:
    branches: [ week_10 ]

env:
  # 0.05 is intentionally low: current v1/v2 tuned models score 0% and
  # 10% accuracy respectively (see task4_analysis.md) since 3 epochs of
  # tuning on ~120 examples wasn't enough to override Gemini's default
  # verbose behavior. This threshold is set to catch a *complete*
  # collapse (a model regressing all the way to 0% -- i.e. v1's current
  # state) rather than a realistic production bar. Raise this once the
  # models are retuned with stronger settings (more epochs, explicit
  # output-format instructions) and genuinely improve.
  ACCURACY_THRESHOLD: "0.05"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install google-cloud-aiplatform

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Run evaluation against both tuned endpoints
        id: eval
        env:
          # evaluate_and_compare.py's init_vertexai() reads these
          # directly from the environment -- gcloud auth alone is not
          # enough, the script needs them explicitly.
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_LOCATION: us-central1
        run: |
          python evaluate_and_compare.py \
            --v1-endpoint "${{ secrets.V1_ENDPOINT_NAME }}" \
            --v2-endpoint "${{ secrets.V2_ENDPOINT_NAME }}" \
            | tee eval_output.txt

      - name: Check accuracy threshold (regression guard)
        run: |
          python - <<'PYEOF'
          import json, sys

          with open("data/evaluation_comparison.json") as f:
              results = json.load(f)

          threshold = float("${{ env.ACCURACY_THRESHOLD }}")
          failed = False
          for r in results:
              print(f"{r['version']}: accuracy={r['accuracy']:.3f}, "
                    f"format_compliance={r['format_compliance']:.3f}")
              if r["accuracy"] < threshold:
                  print(f"REGRESSION: {r['version']} accuracy "
                        f"{r['accuracy']:.3f} is below threshold {threshold}")
                  failed = True

          if failed:
              sys.exit(1)
          print("All model versions meet the accuracy threshold.")
          PYEOF

      - name: Upload evaluation results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-evaluation-results
          path: |
            eval_output.txt
            data/evaluation_comparison.json
